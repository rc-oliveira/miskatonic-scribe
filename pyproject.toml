[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miskatonic-scribe"
version = "1.0.0"
description = "Telegram Bot for registering Arkham Horror LCG cards via voice messages using Whisper, Gemini, and ArkhamDB fuzzy matching."
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
